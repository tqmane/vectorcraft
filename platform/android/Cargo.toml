[package]
name = "craft-android"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
egui = "0.36"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.36", default-features = false, features = ["wgpu", "android-game-activity"] }
winit = { version = "0.30.13", default-features = false, features = ["android-game-activity"] }
jni = "0.21"
getrandom = "0.3"
android_logger = "0.15"
log = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }

[lints.rust]
unsafe_code = "deny"
